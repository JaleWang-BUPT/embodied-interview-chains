name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  examples:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install CPU-only test dependency
        run: python -m pip install -r requirements-test.txt --index-url https://download.pytorch.org/whl/cpu
      - name: Test all handwritten and PyTorch examples (no skipped dependency)
        run: |
          python -c "import torch; print(torch.__version__)"
          python -m unittest discover -s tests -v
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Test validation and review snapshot logic
        run: node --test tests/content.test.mjs
      - name: Require valid content and review snapshot status
        # 维护者决策（2026-10-27，见 WORKFLOW.md）：免复检直接发布；
        # validate 仍强制格式/计数校验，快照状态仅展示不阻断。
        run: node tools/validate.mjs
      - name: Render site from volumes
        run: node tools/render.mjs
      - name: Check generated pages
        run: node tools/check-site.mjs
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
  deploy:
    needs: [build, examples]
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
